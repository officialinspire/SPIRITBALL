<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Pinch-zoom is intentionally left enabled (user-scalable, higher maximum-scale) for
         low-vision players; touch-action: manipulation in styles.css already prevents this
         from causing double-tap-zoom on the game's own buttons. See release-prompts/12-*.md. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="SPIRITBALL - DMT-inspired psychedelic pinball game">
    <title>SPIRITBALL - Vision Quest Pinball</title>

    <!-- PWA manifest + icons, so "Add to Home Screen" gets a real name/icon instead of a
         blank/default one; see release-prompts/10-*.md -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

    <!-- Phaser 3 from CDN, with an automatic fallback CDN and a visible message if both fail
         to load (e.g. blocked network, offline, ad-blocker false positive) instead of a
         silent blank canvas; see release-prompts/10-*.md. The handler functions are defined
         BEFORE the CDN <script> tag below (not after) so onerror can never fire before
         SPIRITBALL_loadPhaserFallback exists - relying on "the network request will always be
         slower than parsing the next tag" would work in practice but isn't guaranteed. -->
    <script>
        function SPIRITBALL_loadPhaserFallback() {
            var fallback = document.createElement('script');
            fallback.src = 'https://unpkg.com/phaser@3.60.0/dist/phaser.min.js';
            fallback.async = false; // keep it load-blocking so window 'load' waits for it
            fallback.onerror = SPIRITBALL_showEngineLoadError;
            document.head.appendChild(fallback);
        }

        function SPIRITBALL_showEngineLoadError() {
            var container = document.getElementById('game-container');
            if (container) {
                container.innerHTML =
                    '<div style="color:#00ffff;font-family:Arial,sans-serif;text-align:center;' +
                    'padding:24px;max-width:320px;line-height:1.5;">' +
                    'Failed to load the game engine.<br>Check your connection and reload the page.' +
                    '</div>';
            }
        }

        window.addEventListener('load', function () {
            if (typeof Phaser === 'undefined') {
                SPIRITBALL_showEngineLoadError();
            }
        });
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"
            onerror="SPIRITBALL_loadPhaserFallback()"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Audiowide&family=Righteous&family=Bungee+Shade&family=Monoton&family=Permanent+Marker&display=swap" rel="stylesheet">

    <!-- Game Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <!-- Shown on mobile devices held in landscape, where the portrait playfield has no
             room to render controls; see release-prompts/02-*.md -->
        <div id="rotate-overlay" class="rotate-overlay">
            <div class="rotate-overlay-content">
                <span class="rotate-icon">&#8635;</span>
                <p>Rotate your device to portrait to play SPIRITBALL</p>
            </div>
        </div>

        <div id="game-wrapper">
            <div id="game-container"></div>
            <!-- Pause Button (stays in game area) -->
            <button id="pause-btn" class="pause-btn" aria-label="Pause Game">
                <span>⏸</span>
            </button>
        </div>

        <!-- Mobile Touch Controls Container -->
        <div id="controls-container">
            <button id="left-flipper-btn" class="flipper-btn left" aria-label="Left Flipper">
                <span>◀</span>
            </button>
            <button id="launch-btn" class="launch-btn" aria-label="Launch Ball">
                <span>⚡</span>
            </button>
            <button id="right-flipper-btn" class="flipper-btn right" aria-label="Right Flipper">
                <span>▶</span>
            </button>
        </div>
    </div>

    <!-- Game Script -->
    <script src="index.js"></script>
</body>
</html>
