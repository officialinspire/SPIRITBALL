<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="SPIRITBALL - DMT-inspired psychedelic pinball game">
    <title>SPIRITBALL - Vision Quest Pinball</title>
    
    <!-- Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700;900&family=Audiowide&display=swap" rel="stylesheet">

    <!-- Game Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="app-container">
        <div id="game-wrapper">
            <div id="game-container"></div>
            <!-- Pause Button (stays in game area) -->
            <button id="pause-btn" class="pause-btn" aria-label="Pause Game">
                <span>⏸</span>
            </button>
        </div>

        <!-- Mobile Touch Controls Container -->
        <div id="controls-container">
            <button id="left-flipper-btn" class="flipper-btn left" aria-label="Left Flipper">
                <span>◀</span>
            </button>
            <button id="launch-btn" class="launch-btn" aria-label="Launch Ball">
                <span>⚡</span>
            </button>
            <button id="right-flipper-btn" class="flipper-btn right" aria-label="Right Flipper">
                <span>▶</span>
            </button>
        </div>
    </div>

    <!-- Game Script -->
    <script src="index.js"></script>
</body>
</html>
